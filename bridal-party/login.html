<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridal Party Login | Josh & Ashley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Medieval Decorative Elements -->
  <div class="page-border-outer"></div>
  <div class="page-border-inner"></div>
  <div class="vine-left"></div>
  <div class="vine-right"></div>
  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <section class="login-section">
    <div class="login-box">
      <h2 style="color:var(--gold);">Bridal Party</h2>
      <div class="divider"></div>
      <p>Enter the password to access the wedding planning hub.</p>

      <form id="login-form">
        <input type="password" id="bp-password" placeholder="Enter password" autocomplete="off">
        <p class="error-msg">Incorrect password. Please try again.</p>
        <button type="submit" class="btn btn-filled" style="width:100%;">Enter</button>
      </form>

      <p style="margin-top:2rem;font-size:0.8rem;color:var(--text-dim);">
        <a href="../index.html">&larr; Back to main site</a>
      </p>
    </div>
  </section>

  <script src="../js/auth.js"></script>
</body>
</html>
