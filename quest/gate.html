<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shield Speaks…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+DW+Pica+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/faire.css?v=11">
  <style>
    .quest-wrap { min-height: calc(100vh - 6rem); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5rem 2rem 4rem; }
    .quest-scroll {
      max-width: 580px; width: 100%;
      background: rgba(248,235,199,0.68);
      border: 1px solid var(--gold-soft);
      padding: 3rem 2.5rem; text-align: center; position: relative;
    }
    .quest-scroll::before { content:''; position:absolute; inset:10px; border:1px solid rgba(160,117,36,0.25); pointer-events:none; }
    .quest-scroll > * { position: relative; }
    .quest-badge {
      display: inline-block; font-family: var(--body); font-variant: small-caps;
      letter-spacing: 0.3em; font-size: 0.78rem; color: var(--gold-deep); margin-bottom: 1rem;
    }
    .quest-scroll h1 { font-family: var(--serif); color: var(--rose); font-size: clamp(2.2rem, 4vw, 2.8rem); margin-bottom: 0.6rem; font-weight: 400; }
    .quest-scroll p.intro { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 1.15rem; line-height: 1.6; margin: 0 auto 1.5rem; max-width: 40ch; }
    .gate-question { font-family: var(--serif); color: var(--rose); font-size: 1.35rem; font-style: italic; margin: 1.8rem 0 1.25rem; line-height: 1.45; }
    .gate-input-box { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 0.5rem; }
    .gate-input-box input {
      padding: 0.8rem 1.2rem; border: 1px solid var(--gold-deep);
      background: var(--paper-highlight); font-family: var(--serif); font-size: 1.05rem;
      color: var(--ink); text-align: center; min-width: 220px; letter-spacing: 1px;
    }
    .gate-input-box input:focus { border-color: var(--rose); }
    .error-msg { color: var(--rose); font-style: italic; opacity: 0; transition: opacity 0.3s; min-height: 1.3em; margin-top: 0.5rem; }
    .error-msg.show { opacity: 1; }
    .back-link { margin-top: 2rem; font-family: var(--serif); font-style: italic; text-align: center; font-size: 1rem; position: relative; z-index: 3; }
    .back-link a { color: var(--rose); border-bottom: 1px solid rgba(139,42,42,0.4); padding: 0.3rem 0; }
  </style>
</head>
<body data-screen-label="Quest Gate">
  <div class="page-decor" aria-hidden="true"><span class="corner corner--tl"></span><span class="corner corner--tr"></span><span class="corner corner--bl"></span><span class="corner corner--br"></span></div>
  <span class="vine vine--left" aria-hidden="true"></span><span class="vine vine--right" aria-hidden="true"></span><div class="quest-wrap">
    <div class="quest-scroll">
      <span class="quest-badge">A Guarded Threshold</span>
      <h1>The <em>Shield</em> Awakens</h1>
      <p class="intro">You have touched the shield of the heart-sworn. A voice echoes from beyond the veil of parchment…</p>
      <span class="divider-orn divider-orn--small" aria-hidden="true"></span>
      <p class="gate-question">“At the table of fate and fortune, who is your God?”</p>
      <div class="gate-input-box">
        <input type="text" id="gate-answer" placeholder="Speak the name…" autofocus>
        <button class="btn btn--solid" id="gate-submit">Submit</button>
      </div>
      <p class="error-msg" id="gate-error">The shield grows cold. That is not the name it seeks.</p>
    </div>
    <p class="back-link"><a href="../index.html">← Return to the Kingdom</a></p>
  </div>

  <script>
    const input = document.getElementById('gate-answer');
    const btn = document.getElementById('gate-submit');
    const error = document.getElementById('gate-error');
    function attempt() {
      const val = input.value.toLowerCase().trim();
      if (val === 'wynn') { window.location.href = 'step1.html'; }
      else { error.classList.add('show'); input.value=''; input.focus(); setTimeout(()=>error.classList.remove('show'), 2500); }
    }
    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  </script>
</body>
</html>
