<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <g opacity="0.3">
    <!-- Main wall -->
    <rect x="20" y="40" width="80" height="55" fill="#b8860b" stroke="#8b1a1a" stroke-width="1"/>

    <!-- Left tower -->
    <rect x="5" y="20" width="25" height="75" fill="#b8860b" stroke="#8b1a1a" stroke-width="1"/>
    <!-- Left tower battlements -->
    <rect x="3" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="13" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="23" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <!-- Left tower window -->
    <path d="M14 35 A4 4 0 0 1 22 35 L22 45 L14 45 Z" fill="#2c1810" opacity="0.4"/>

    <!-- Right tower -->
    <rect x="90" y="20" width="25" height="75" fill="#b8860b" stroke="#8b1a1a" stroke-width="1"/>
    <!-- Right tower battlements -->
    <rect x="88" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="98" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="108" y="12" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <!-- Right tower window -->
    <path d="M98 35 A4 4 0 0 1 106 35 L106 45 L98 45 Z" fill="#2c1810" opacity="0.4"/>

    <!-- Center battlements -->
    <rect x="28" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="38" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="48" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="58" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="68" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>
    <rect x="78" y="32" width="7" height="10" fill="#b8860b" stroke="#8b1a1a" stroke-width="0.8"/>

    <!-- Gate arch -->
    <path d="M48 95 L48 65 A12 12 0 0 1 72 65 L72 95" fill="#2c1810" opacity="0.4" stroke="#8b1a1a" stroke-width="1"/>
    <!-- Gate portcullis lines -->
    <line x1="54" y1="65" x2="54" y2="95" stroke="#8b1a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="60" y1="62" x2="60" y2="95" stroke="#8b1a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="66" y1="65" x2="66" y2="95" stroke="#8b1a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="48" y1="75" x2="72" y2="75" stroke="#8b1a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="48" y1="85" x2="72" y2="85" stroke="#8b1a1a" stroke-width="0.5" opacity="0.5"/>

    <!-- Flags -->
    <line x1="17" y1="2" x2="17" y2="14" stroke="#8b1a1a" stroke-width="1"/>
    <path d="M17 2 L27 5 L17 8" fill="#8b1a1a" opacity="0.6"/>
    <line x1="102" y1="2" x2="102" y2="14" stroke="#8b1a1a" stroke-width="1"/>
    <path d="M102 2 L112 5 L102 8" fill="#8b1a1a" opacity="0.6"/>
  </g>
</svg>