<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <!-- D20 Icosahedron -->
  <!-- Outer shape -->
  <polygon points="50,5 95,35 80,95 20,95 5,35"
           fill="rgba(139, 26, 26, 0.08)" stroke="#8b1a1a" stroke-width="2.5"/>
  <!-- Inner facets -->
  <line x1="50" y1="5" x2="20" y2="95" stroke="#8b1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="50" y1="5" x2="80" y2="95" stroke="#8b1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="5" y1="35" x2="80" y2="95" stroke="#8b1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="95" y1="35" x2="20" y2="95" stroke="#8b1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="5" y1="35" x2="95" y2="35" stroke="#8b1a1a" stroke-width="1.2" opacity="0.5"/>
  <!-- Center highlight -->
  <polygon points="50,38 65,58 50,78 35,58" fill="rgba(184, 134, 11, 0.1)" stroke="rgba(184, 134, 11, 0.3)" stroke-width="0.8"/>
  <!-- The "20" -->
  <text x="50" y="66" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="700" fill="#8b1a1a">20</text>
</svg>